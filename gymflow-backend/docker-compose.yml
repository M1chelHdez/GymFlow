services:
  postgres:
    image: postgres:17-alpine
    container_name: gymflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymflow}
      POSTGRES_USER: ${POSTGRES_USER:-gymflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymflow_dev}
    ports:
      - "5432:5432"
    volumes:
      - gymflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymflow} -d ${POSTGRES_DB:-gymflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gymflow_pgdata:
